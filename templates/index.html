<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubase Script Assistant</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            background-color: #f8f9fa;
        }
        h1 {
            text-align: center;
            color: #005f87; /* A color inspired by Cubase */
        }
        textarea {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            min-height: 100px;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #result-container {
            margin-top: 2rem;
        }
        h2 {
            color: #333;
        }
        pre {
            background-color: #282c34; /* Dark theme for code */
            color: #abb2bf;
            padding: 1rem;
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
            text-align: left; /* Align code to the left */
            direction: ltr; /* Ensure code block is LTR */
        }
        .error {
            color: #d9534f;
            border: 1px solid #d9534f;
            background-color: #f2dede;
            padding: 1rem;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Cubase Script Assistant</h1>
    <p>הזן בקשה בשפה טבעית (עברית או אנגלית) כדי ליצור סקריפט לקיובייס.</p>

    <form id="prompt-form">
        <textarea id="prompt-input" placeholder="לדוגמה: צור 4 ערוצי אודיו סטריאו חדשים" required></textarea>
        <button id="submit-button" type="submit">צור סקריפט</button>
    </form>

    <div id="result-container">
        <h2>תוצאה:</h2>
        <div id="result">
            <pre><code id="code-output">...הסקריפט שייוצר יופיע כאן</code></pre>
        </div>
    </div>

    <script>
        const form = document.getElementById('prompt-form');
        const input = document.getElementById('prompt-input');
        const submitButton = document.getElementById('submit-button');
        const resultDiv = document.getElementById('result');
        const codeOutput = document.getElementById('code-output');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = input.value.trim();
            if (!prompt) return;

            // Disable button and show loading state
            submitButton.disabled = true;
            submitButton.textContent = 'מעבד...';
            resultDiv.classList.remove('error');
            // Clear previous output and show loading message
            codeOutput.parentElement.style.display = 'block';
            codeOutput.textContent = '...טוען';


            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt: prompt }),
                });

                const data = await response.json();

                if (response.ok) {
                    codeOutput.textContent = data.code || '// The model returned an empty script.';
                } else {
                    // Use the pre block for errors too for consistency
                    codeOutput.textContent = `שגיאה: ${data.error || 'An unknown error occurred.'}`;
                }

            } catch (err) {
                codeOutput.textContent = `שגיאת רשת: ${err.message}`;
            } finally {
                // Re-enable button
                submitButton.disabled = false;
                submitButton.textContent = 'צור סקריפט';
            }
        });
    </script>

</body>
</html>
