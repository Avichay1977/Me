<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubase Script Assistant</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            background-color: #f8f9fa;
        }
        h1 {
            text-align: center;
            color: #005f87;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
            align-items: center;
        }
        #examples-dropdown {
            flex-grow: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: white;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            min-height: 120px;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }
        #submit-button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
        }
        #submit-button:hover {
            background-color: #0056b3;
        }
        #submit-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #result-container {
            margin-top: 2rem;
            position: relative;
        }
        #copy-button {
            position: absolute;
            top: 10px;
            left: 10px; /* Adjusted for LTR content in an RTL page */
            padding: 5px 10px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #result-container:hover #copy-button {
            opacity: 1;
        }
        pre {
            background-color: #282c34;
            color: #abb2bf;
            padding: 1.5rem;
            padding-top: 2.5rem; /* Make space for the copy button */
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
            text-align: left;
            direction: ltr;
        }
        .error-message {
            color: #d9534f;
            background-color: #f2dede;
            border: 1px solid #d9534f;
        }
        .voice-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }
        #voice-button {
            padding: 12px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        #voice-button:hover {
            background-color: #218838;
        }
        #voice-button.recording {
            background-color: #dc3545;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        #voice-status {
            padding: 12px;
            background-color: #e9ecef;
            border-radius: 5px;
            flex-grow: 1;
            text-align: center;
            font-style: italic;
            color: #6c757d;
        }
        #voice-status.listening {
            background-color: #d4edda;
            color: #155724;
        }
        .button-row {
            display: flex;
            gap: 10px;
        }
        #submit-button {
            flex-grow: 1;
        }
        #speak-button {
            padding: 12px 20px;
            background-color: #17a2b8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        #speak-button:hover {
            background-color: #138496;
        }
        #speak-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>🎤 Cubase Script Assistant - קולי</h1>
    <p>הזן בקשה בשפה טבעית, דבר למיקרופון, או בחר דוגמה כדי ליצור סקריפט לקיובייס.</p>

    <div class="voice-controls">
        <button id="voice-button" type="button">🎤 לחץ לדיבור</button>
        <div id="voice-status">לחץ על המיקרופון כדי להתחיל...</div>
    </div>

    <div class="controls">
        <label for="examples-dropdown">דוגמאות:</label>
        <select id="examples-dropdown">
            <option value="">בחר דוגמה...</option>
            <option value="צור 4 ערוצי אודיו סטריאו חדשים">צור 4 ערוצי אודיו סטריאו</option>
            <option value="צור ערוץ Group חדש בשם 'Drums'">צור ערוץ Group בשם 'Drums'</option>
            <option value="צבע את כל ערוצי ה-MIDI בכחול">צבע את כל ערוצי ה-MIDI בכחול</option>
            <option value="הוסף אפקט Reverb לכל הערוצים הנבחרים">הוסף Reverb לערוצים נבחרים</option>
        </select>
    </div>

    <form id="prompt-form">
        <textarea id="prompt-input" placeholder="לדוגמה: מחק את כל הערוצים הריקים" required></textarea>
        <div class="button-row">
            <button id="submit-button" type="submit">צור סקריפט</button>
            <button id="speak-button" type="button">🔊 הקרא</button>
        </div>
    </form>

    <div id="result-container">
        <button id="copy-button">העתק</button>
        <h2>תוצאה:</h2>
        <pre><code id="code-output">...הסקריפט שייוצר יופיע כאן</code></pre>
    </div>

    <script>
        const form = document.getElementById('prompt-form');
        const input = document.getElementById('prompt-input');
        const submitButton = document.getElementById('submit-button');
        const codeOutput = document.getElementById('code-output');
        const copyButton = document.getElementById('copy-button');
        const examplesDropdown = document.getElementById('examples-dropdown');
        const voiceButton = document.getElementById('voice-button');
        const voiceStatus = document.getElementById('voice-status');
        const speakButton = document.getElementById('speak-button');

        // --- Voice Recognition Setup ---
        let recognition = null;
        let isListening = false;

        // Check if browser supports Speech Recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();

            recognition.lang = 'he-IL'; // Hebrew language
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isListening = true;
                voiceButton.classList.add('recording');
                voiceButton.textContent = '🎤 מקשיב...';
                voiceStatus.classList.add('listening');
                voiceStatus.textContent = 'מקשיב לך עכשיו... דבר בבקשה!';
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                input.value = transcript;
                voiceStatus.textContent = `שמעתי: "${transcript}"`;
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                voiceStatus.textContent = `שגיאה: ${event.error === 'no-speech' ? 'לא שמעתי כלום' : 'בעיה בזיהוי קולי'}`;
                stopListening();
            };

            recognition.onend = () => {
                stopListening();
                if (input.value.trim()) {
                    voiceStatus.textContent = 'מעולה! לחץ "צור סקריפט" או דבר שוב';
                } else {
                    voiceStatus.textContent = 'לחץ על המיקרופון כדי להתחיל...';
                }
            };
        } else {
            voiceButton.disabled = true;
            voiceButton.textContent = '❌ הדפדפן לא תומך';
            voiceStatus.textContent = 'נסה Chrome או Edge';
        }

        function stopListening() {
            isListening = false;
            voiceButton.classList.remove('recording');
            voiceButton.textContent = '🎤 לחץ לדיבור';
            voiceStatus.classList.remove('listening');
        }

        // --- Voice Button Click ---
        voiceButton.addEventListener('click', () => {
            if (!recognition) return;

            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        // --- Text-to-Speech Setup ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'he-IL';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;

                speakButton.disabled = true;
                speakButton.textContent = '🔊 מדבר...';

                utterance.onend = () => {
                    speakButton.disabled = false;
                    speakButton.textContent = '🔊 הקרא';
                };

                utterance.onerror = () => {
                    speakButton.disabled = false;
                    speakButton.textContent = '🔊 הקרא';
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        // --- Speak Button Click ---
        speakButton.addEventListener('click', () => {
            const code = codeOutput.textContent;
            if (code && !codeOutput.parentElement.classList.contains('error-message')) {
                speak('הקוד מוכן. ' + code);
            } else if (codeOutput.parentElement.classList.contains('error-message')) {
                speak('יש שגיאה. ' + code);
            }
        });

        // --- Event Listener for Examples Dropdown ---
        examplesDropdown.addEventListener('change', (e) => {
            if (e.target.value) {
                input.value = e.target.value;
                input.focus();
            }
        });

        // --- Event Listener for Copy Button ---
        copyButton.addEventListener('click', () => {
            const codeToCopy = codeOutput.textContent;
            if (codeToCopy && !codeOutput.parentElement.classList.contains('error-message')) {
                navigator.clipboard.writeText(codeToCopy).then(() => {
                    copyButton.textContent = 'הועתק!';
                    setTimeout(() => {
                        copyButton.textContent = 'העתק';
                    }, 2000);
                }).catch(err => {
                    console.error('Failed to copy text: ', err);
                    copyButton.textContent = 'שגיאה';
                });
            }
        });

        // --- Event Listener for Form Submission ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = input.value.trim();
            if (!prompt) return;

            submitButton.disabled = true;
            submitButton.textContent = 'מעבד...';
            codeOutput.parentElement.classList.remove('error-message');
            codeOutput.textContent = '...טוען';

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt }),
                });

                const data = await response.json();

                if (response.ok) {
                    codeOutput.textContent = data.code || '// The model returned an empty script.';
                } else {
                    codeOutput.parentElement.classList.add('error-message');
                    codeOutput.textContent = `שגיאה: ${data.error || 'An unknown error occurred.'}`;
                }

            } catch (err) {
                codeOutput.parentElement.classList.add('error-message');
                codeOutput.textContent = `שגיאת רשת: ${err.message}`;
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'צור סקריפט';
            }
        });
    </script>

</body>
</html>
