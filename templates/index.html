<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubase Script Assistant</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            background-color: #f8f9fa;
        }
        h1 {
            text-align: center;
            color: #005f87;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
            align-items: center;
        }
        #examples-dropdown {
            flex-grow: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: white;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            min-height: 120px;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }
        #submit-button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
        }
        #submit-button:hover {
            background-color: #0056b3;
        }
        #submit-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #result-container {
            margin-top: 2rem;
            position: relative;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            justify-content: flex-start;
        }
        .action-btn {
            padding: 8px 16px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }
        .action-btn:hover {
            background-color: #545b62;
        }
        .action-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #download-button {
            background-color: #28a745;
        }
        #download-button:hover {
            background-color: #218838;
        }
        .install-help {
            margin-top: 15px;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        .install-help summary {
            cursor: pointer;
            font-weight: bold;
            color: #005f87;
        }
        .install-help ol {
            margin: 10px 0 0 20px;
            padding: 0;
        }
        .install-help li {
            margin-bottom: 8px;
        }
        .install-help .path {
            display: block;
            background-color: #282c34;
            color: #abb2bf;
            padding: 8px;
            border-radius: 3px;
            margin-top: 5px;
            font-size: 0.85rem;
            direction: ltr;
            text-align: left;
            user-select: all;
        }
        pre {
            background-color: #282c34;
            color: #abb2bf;
            padding: 1.5rem;
            padding-top: 2.5rem; /* Make space for the copy button */
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
            text-align: left;
            direction: ltr;
        }
        pre.error-message {
            color: #d9534f;
            background-color: #f2dede;
            border: 1px solid #d9534f;
        }
    </style>
</head>
<body>

    <h1>Cubase Script Assistant</h1>
    <p>הזן בקשה בשפה טבעית או בחר דוגמה כדי ליצור סקריפט לקיובייס.</p>

    <div class="controls">
        <label for="examples-dropdown">דוגמאות:</label>
        <select id="examples-dropdown">
            <option value="">בחר דוגמה...</option>
            <option value="צור 4 ערוצי אודיו סטריאו חדשים">צור 4 ערוצי אודיו סטריאו</option>
            <option value="צור ערוץ Group חדש בשם 'Drums'">צור ערוץ Group בשם 'Drums'</option>
            <option value="צבע את כל ערוצי ה-MIDI בכחול">צבע את כל ערוצי ה-MIDI בכחול</option>
            <option value="הוסף אפקט Reverb לכל הערוצים הנבחרים">הוסף Reverb לערוצים נבחרים</option>
        </select>
    </div>

    <form id="prompt-form">
        <textarea id="prompt-input" placeholder="לדוגמה: מחק את כל הערוצים הריקים" required></textarea>
        <button id="submit-button" type="submit">צור סקריפט</button>
    </form>

    <div id="result-container">
        <div class="action-buttons">
            <button id="copy-button" class="action-btn">📋 העתק</button>
            <button id="download-button" class="action-btn">⬇️ הורד קובץ .js</button>
        </div>
        <h2>תוצאה:</h2>
        <pre><code id="code-output">...הסקריפט שייוצר יופיע כאן</code></pre>
        <details class="install-help">
            <summary>איך להתקין בקיובייס?</summary>
            <ol>
                <li>הורד את הקובץ</li>
                <li>העבר לתיקייה:
                    <code class="path">%APPDATA%\Steinberg\Cubase\MIDI Remote\Driver Scripts\Local\</code>
                </li>
                <li>הפעל מחדש את Cubase</li>
            </ol>
        </details>
    </div>

    <script>
        const form = document.getElementById('prompt-form');
        const input = document.getElementById('prompt-input');
        const submitButton = document.getElementById('submit-button');
        const codeOutput = document.getElementById('code-output');
        const copyButton = document.getElementById('copy-button');
        const downloadButton = document.getElementById('download-button');
        const examplesDropdown = document.getElementById('examples-dropdown');

        // --- Event Listener for Examples Dropdown ---
        examplesDropdown.addEventListener('change', (e) => {
            if (e.target.value) {
                input.value = e.target.value;
                input.focus();
            }
        });

        // --- Event Listener for Copy Button ---
        copyButton.addEventListener('click', () => {
            const codeToCopy = codeOutput.textContent;
            if (codeToCopy && !codeOutput.closest('pre').classList.contains('error-message')) {
                navigator.clipboard.writeText(codeToCopy).then(() => {
                    copyButton.textContent = '✓ הועתק!';
                    setTimeout(() => {
                        copyButton.textContent = '📋 העתק';
                    }, 2000);
                }).catch(err => {
                    console.error('Failed to copy text: ', err);
                    copyButton.textContent = 'שגיאה';
                });
            }
        });

        // --- Event Listener for Download Button ---
        downloadButton.addEventListener('click', () => {
            const code = codeOutput.textContent;
            if (!code || codeOutput.closest('pre').classList.contains('error-message') || code === '...הסקריפט שייוצר יופיע כאן' || code === '...טוען') {
                return;
            }

            // Generate filename from timestamp
            const timestamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '').replace('T', '_');
            const filename = `cubase_script_${timestamp}.js`;

            // Create and download file
            const blob = new Blob([code], { type: 'application/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            downloadButton.textContent = '✓ הורד!';
            setTimeout(() => {
                downloadButton.textContent = '⬇️ הורד קובץ .js';
            }, 2000);
        });

        // --- Event Listener for Form Submission ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = input.value.trim();
            if (!prompt) return;

            submitButton.disabled = true;
            submitButton.textContent = 'מעבד...';
            codeOutput.closest('pre').classList.remove('error-message');
            codeOutput.textContent = '...טוען';

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt }),
                });

                const data = await response.json();

                if (response.ok) {
                    codeOutput.textContent = data.code || '// The model returned an empty script.';
                } else {
                    codeOutput.closest('pre').classList.add('error-message');
                    codeOutput.textContent = `שגיאה: ${data.error || 'An unknown error occurred.'}`;
                }

            } catch (err) {
                codeOutput.closest('pre').classList.add('error-message');
                codeOutput.textContent = `שגיאת רשת: ${err.message}`;
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'צור סקריפט';
            }
        });
    </script>

</body>
</html>
