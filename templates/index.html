<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Audio Assistant</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        main {
            width: 100%;
            max-w: 1000px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        h1 {
            text-align: center;
            color: #1a73e8;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }
        .card {
            background-color: #222;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .card h2 {
            text-align: center;
            margin-top: 0;
            color: #fff;
        }
        #analyzer-container, #screen-capture-container {
            flex-grow: 1;
            background-color: #000;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
        }
        #video-element {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #conversation-container {
            background-color: #222;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            flex-grow: 1;
            overflow-y: auto;
            min-height: 200px;
            margin-bottom: 20px;
        }
        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 8px;
            max-width: 80%;
        }
        .user-message {
            background-color: #1a73e8;
            align-self: flex-end;
            margin-left: auto;
        }
        .assistant-message {
            background-color: #333;
            align-self: flex-start;
            white-space: pre-wrap; /* To format code correctly */
            text-align: left;
            direction: ltr;
        }
        footer {
            padding: 20px;
            text-align: center;
        }
        button#capture-button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            color: white;
            transition: background-color 0.3s;
        }
        .start {
            background-color: #1a73e8;
        }
        .stop {
            background-color: #d9534f;
        }
    </style>
</head>
<body>

    <main>
        <h1>Pro Audio Assistant</h1>

        <div class="grid-container">
            <div class="card">
                <h2>Audio Analyzer</h2>
                <div id="analyzer-container">ממתין ללכידה...</div>
            </div>
            <div class="card">
                <h2>Screen Sharing</h2>
                <div id="screen-capture-container">
                    <video id="video-element" autoplay muted></video>
                    <p id="screen-capture-placeholder">שיתוף מסך אינו פעיל</p>
                </div>
            </div>
        </div>

        <div id="conversation-container">
            <!-- Messages will be injected here -->
        </div>
    </main>

    <footer>
        <button id="capture-button" class="start">התחל לכידה</button>
    </footer>

    <script type="module">
        import AudioMotionAnalyzer from 'https://cdn.skypack.dev/audiomotion-analyzer?min';

        const captureButton = document.getElementById('capture-button');
        const analyzerContainer = document.getElementById('analyzer-container');
        const videoElement = document.getElementById('video-element');
        const screenCapturePlaceholder = document.getElementById('screen-capture-placeholder');
        const conversationContainer = document.getElementById('conversation-container');

        let audioMotion;
        let recognition;
        let isCapturing = false;
        let mediaStream;
        let screenStream;

        // --- Speech Recognition Setup ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'he-IL';

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                console.log('User said:', transcript);
                addMessage(transcript, 'user');
                getAiResponse(transcript);
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                if (event.error !== 'no-speech') {
                    addMessage(`שגיאת זיהוי דיבור: ${event.error}`, 'error');
                }
            };
        } else {
            console.error('Speech recognition not supported in this browser.');
        }


        // --- Main Functions ---
        const startCapture = async () => {
            if (!SpeechRecognition) {
                alert('זיהוי דיבור אינו נתמך בדפדפן זה.');
                return;
            }
            isCapturing = true;
            captureButton.textContent = 'עצור לכידה';
            captureButton.className = 'stop';
            conversationContainer.innerHTML = ''; // Clear conversation

            try {
                // 1. Get Mic Audio
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });

                // 2. Start AudioMotionAnalyzer
                const audioCtx = new AudioContext();
                const source = audioCtx.createMediaStreamSource(mediaStream);
                audioMotion = new AudioMotionAnalyzer(analyzerContainer, {
                    source: source,
                    mode: 0,
                    fftSize: 8192,
                    showPeaks: true,
                    channelLayout: 'dual-horizontal',
                    gradient: 'prism'
                });

                // 3. Start Speech Recognition
                recognition.start();

                // 4. Attempt Screen Capture
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    videoElement.srcObject = screenStream;
                    videoElement.style.display = 'block';
                    screenCapturePlaceholder.style.display = 'none';

                    screenStream.getVideoTracks()[0].onended = () => {
                        console.log('Screen sharing stopped by user.');
                        videoElement.style.display = 'none';
                        screenCapturePlaceholder.style.display = 'block';
                        screenCapturePlaceholder.textContent = 'שיתוף המסך הופסק.';
                    };
                } catch (err) {
                    console.warn('Screen capture failed or was denied:', err.message);
                    screenCapturePlaceholder.textContent = 'שיתוף מסך נדחה או נכשל.';
                }

            } catch (err) {
                console.error('Failed to start capture:', err);
                addMessage(`שגיאה בהפעלת הלכידה: ${err.message}`, 'error');
                stopCapture();
            }
        };

        const stopCapture = () => {
            isCapturing = false;
            captureButton.textContent = 'התחל לכידה';
            captureButton.className = 'start';

            if (recognition) recognition.stop();
            if (audioMotion) audioMotion.destroy();

            mediaStream?.getTracks().forEach(track => track.stop());
            screenStream?.getTracks().forEach(track => track.stop());

            videoElement.srcObject = null;
            videoElement.style.display = 'none';
            screenCapturePlaceholder.style.display = 'block';
            screenCapturePlaceholder.textContent = 'שיתוף מסך אינו פעיל';
            analyzerContainer.innerHTML = 'ממתין ללכידה...';
        };

        const getAiResponse = async (prompt) => {
            addMessage('...חושב', 'assistant-loading');

            // Capture frame if screen sharing is active
            let image_data_url = null;
            if (screenStream && screenStream.active) {
                try {
                    const videoTrack = screenStream.getVideoTracks()[0];
                    const imageCapture = new ImageCapture(videoTrack);
                    const imageBitmap = await imageCapture.grabFrame();
                    const canvas = document.createElement('canvas');
                    canvas.width = imageBitmap.width;
                    canvas.height = imageBitmap.height;
                    canvas.getContext('2d').drawImage(imageBitmap, 0, 0);
                    image_data_url = canvas.toDataURL('image/jpeg', 0.5);
                } catch (err) {
                    console.error("Could not capture frame:", err);
                    // Don't block the request if frame capture fails
                }
            }

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, image: image_data_url }),
                });
                const data = await response.json();
                const loadingMessage = document.querySelector('.assistant-loading');
                if (loadingMessage) loadingMessage.remove();

                if (response.ok) {
                    addMessage(data.code, 'assistant');
                    // Use browser's built-in TTS
                    speakText(data.code);
                } else {
                    addMessage(`שגיאה מהשרת: ${data.error}`, 'error');
                }
            } catch (err) {
                const loadingMessage = document.querySelector('.assistant-loading');
                if (loadingMessage) loadingMessage.remove();
                addMessage(`שגיאת רשת: ${err.message}`, 'error');
            }
        };

        const speakText = (text) => {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                // Optional: configure voice, rate, pitch
                utterance.lang = 'en-US'; // Use English for code/technical terms
                // If the response is likely Hebrew, you might switch
                if (/[\u0590-\u05FF]/.test(text)) {
                    utterance.lang = 'he-IL';
                }
                window.speechSynthesis.speak(utterance);
            } else {
                console.warn('Speech synthesis not supported in this browser.');
            }
        };

        const addMessage = (text, type) => {
            const messageDiv = document.createElement('div');
            if (type === 'assistant') {
                const pre = document.createElement('pre');
                const code = document.createElement('code');
                code.textContent = text;
                pre.appendChild(code);
                messageDiv.appendChild(pre);
            } else {
                messageDiv.textContent = text;
            }

            if (type === 'error') {
                 messageDiv.className = 'message error-message'; // Add specific error class
                 messageDiv.style.backgroundColor = '#d9534f';
                 messageDiv.style.color = 'white';
            } else if (type === 'assistant-loading') {
                messageDiv.className = 'message assistant-loading';
                messageDiv.style.backgroundColor = '#333';
            }
            else {
                messageDiv.className = `message ${type}-message`;
            }

            conversationContainer.appendChild(messageDiv);
            conversationContainer.scrollTop = conversationContainer.scrollHeight;
        };

        captureButton.addEventListener('click', () => {
            if (isCapturing) {
                stopCapture();
            } else {
                startCapture();
            }
        });
    </script>
</body>
</html>
